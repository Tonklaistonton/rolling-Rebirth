name: Greetings

on: [pull_request, issues]

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/first-interaction@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: |
          Hello there!
          Thank you for filing an issue for the `rolling-Rebirth` project.
          Whether you are just starting out or an experienced programmer/Linux enthusiast, welcome!
          We will review your issue as soon as possible.
        pr-message: |
          Hello there!
          Thank you for filing your first Pull Request to `rolling-Rebirth`.
          We appreciate your contribution and will review it soon!
