name: rolling-rebirth
version: git
summary: Convert Ubuntu into a "rolling release" that tracks the `devel` series
description: |
  Simple shell script to make daily image installs of Ubuntu Desktop,
  and desktop flavours, track the `devel` series. Continued under Project Rebirth.

base: core22
grade: stable
confinement: classic

parts:
  rolling-rebirth:
    plugin: dump
    source: .

apps:
  rolling-rebirth:
    command: rebirth
  rebirth:
    command: rebirth
